name: Monitor scheduled jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run uptime and certificate checks
        run: npm run worker:uptime:once
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WORKER_ID: github-actions-uptime
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}

  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch queued notifications
        env:
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          MONITORING_JOB_SECRET: ${{ secrets.MONITORING_JOB_SECRET }}
        run: |
          if [ -z "$DASHBOARD_BASE_URL" ] || [ -z "$MONITORING_JOB_SECRET" ]; then
            echo "DASHBOARD_BASE_URL and MONITORING_JOB_SECRET must be configured in GitHub Actions secrets." >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --request POST "${DASHBOARD_BASE_URL%/}/api/jobs/notifications" \
            --header "Authorization: Bearer $MONITORING_JOB_SECRET"
